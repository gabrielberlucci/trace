services:
  postgres:
    image: postgres:18-alpine
    container_name: trace-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace_dev_password
      POSTGRES_DB: trace_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trace -d trace_dev']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: trace-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trace-api-dev
    restart: unless-stopped
    command: sh -c "pnpm --filter @app/shared build && cd server && npx prisma generate && npx prisma migrate deploy && pnpm dev"
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://trace:trace_dev_password@postgres:5432/trace_dev?schema=public
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - BASE_URL=http://localhost:3000
      - LOG_LEVEL=debug
      - FRONT_END_ORIGIN=http://localhost:5173
      - JWT_SECRET=dev_jwt_secret_trace_erp_2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/usr/src/app/server/src
      - ./server/prisma:/usr/src/app/server/prisma
      - ./shared/src:/usr/src/app/shared/src
      - ./shared/index.ts:/usr/src/app/shared/index.ts
      - ./server/uploads-xml:/usr/src/app/server/uploads-xml

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: trace-worker-dev
    restart: unless-stopped
    command: sh -c "pnpm --filter @app/shared build && cd server && npx prisma generate && pnpm run worker:upload-xml"
    environment:
      - DATABASE_URL=postgresql://trace:trace_dev_password@postgres:5432/trace_dev?schema=public
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./server/src:/usr/src/app/server/src
      - ./server/prisma:/usr/src/app/server/prisma
      - ./shared/src:/usr/src/app/shared/src
      - ./shared/index.ts:/usr/src/app/shared/index.ts
      - ./server/uploads-xml:/usr/src/app/server/uploads-xml

volumes:
  postgres_dev_data:
  redis_dev_data:
